[profile.release.package.jiff]
opt-level = "z"
[profile.release.package.jaq-json]
opt-level = "z"
[profile.release.package.chardetng]
opt-level = "z"
[profile.release.package.deft-ops]
opt-level = "z"
[profile.release.package.deft-tools-data]
