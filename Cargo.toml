[profile.release.package.usvg]
opt-level = "z"
[profile.release.package.calamine]
opt-level = "z"
[profile.release.package.hayro-postscript]
opt-level = "z"
[profile.release.package.hayro-cmap]
opt-level = "z"
[profile.release.package.icu_collator]
opt-level = "z"
[profile.release.package.icu_segmenter]
opt-level = "z"
[profile.release.package.icu_properties]
opt-level = "z"
[profile.release.package.icu_locale]
opt-level = "z"
[profile.release.package.icu_locale_core]
opt-level = "z"
[profile.release.package.icu_normalizer]
opt-level = "z"
[profile.release.package.icu_provider]
opt-level = "z"
[profile.release.package.icu_collections]
opt-level = "z"
[profile.release.package.plist]
opt-level = "z"
[profile.release.package.quick-xml]
opt-level = "z"
[profile.release.package.pulldown-cmark]
opt-level = "z"
[profile.release.package.rqrr]
opt-level = "z"
[profile.release.package.htmd]
