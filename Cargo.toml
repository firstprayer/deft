[profile.release.package.jaq-std]
opt-level = "z"
[profile.release.package.boon]
opt-level = "z"
[profile.release.package.rust_xlsxwriter]
opt-level = "z"
[profile.release.package.read-fonts]
opt-level = "z"
[profile.release.package.write-fonts]
opt-level = "z"
[profile.release.package.skrifa]
opt-level = "z"
[profile.release.package.subsetter]
