[package]
name = "deftcli"
description = "One local command for every file job an AI agent would otherwise script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "deft_cli"
path = "src/lib.rs"

[[bin]]
name = "deft"
path = "src/main.rs"

# Tests live in the top-level tests/ folder. See tests/README.md.
[[test]]
name = "unit_specs"
path = "../../tests/unit/specs.rs"

[[test]]
name = "unit_help"
path = "../../tests/unit/help.rs"

[[test]]
name = "unit_properties"
path = "../../tests/unit/properties.rs"

[features]

[dependencies]
deft-core.workspace = true
deft-ops.workspace = true
deft-engines.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
deft-tools-pdf.workspace = true
deft-tools-image.workspace = true
insta.workspace = true
proptest.workspace = true
serde.workspace = true
tempfile.workspace = true
glob.workspace = true
toml = "=1.1.8"
