name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, exe: deft }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: deft }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: deft }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: deft }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: deft.exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked -p deftcli --target ${{ matrix.target }}
      - name: Run the binary
        run: |
          deft="$PWD/target/${{ matrix.target }}/debug/${{ matrix.exe }}"
          "$deft" version
          "$deft" doctor
          "$deft" find "shrink pdf"
          cd "$RUNNER_TEMP"
          printf '# Hello\n\nBuilt on ${{ matrix.target }}.\n' > smoke.md
          "$deft" md to-pdf smoke.md -o smoke.pdf
          "$deft" pdf info smoke.pdf
      - name: Unit tests
        run: cargo test-unit --locked
